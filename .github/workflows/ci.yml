name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  windows-package-smoke:
    name: Package and install smoke / Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run smoke:package
      - run: npm run smoke:install

  linux-package-smoke:
    name: Native package smoke / Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install native package tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb
      - run: npm ci
      - run: npm run make
      - name: Verify packaged Linux lifecycle
        env:
          # Forge's raw output cannot carry the root-owned setuid helper used by installed packages.
          LAIR_SMOKE_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run smoke:package
