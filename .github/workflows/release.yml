name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: hackers-lair-${{ github.ref_name }}-windows
          path: out/make/**/*.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $archives = Get-ChildItem -Path 'out\make' -Filter '*.zip' -Recurse
          if (-not $archives) { throw 'Electron Forge did not produce a ZIP archive.' }
          gh release create $env:GITHUB_REF_NAME @($archives.FullName) --generate-notes --verify-tag
