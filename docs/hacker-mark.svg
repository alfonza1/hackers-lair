<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Hacker's Lair operator mark</title>
  <desc id="desc">A neon hooded operator mask over a dark terminal panel.</desc>
  <defs>
    <linearGradient id="panel" x1="18" y1="8" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b211a"/>
      <stop offset="1" stop-color="#020705"/>
    </linearGradient>
    <linearGradient id="hood" x1="64" y1="20" x2="64" y2="108" gradientUnits="userSpaceOnUse">
