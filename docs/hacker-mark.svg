  <path d="M55 91h18" fill="none" stroke="#66ffb5" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="18" cy="64" r="2" fill="#5ed0ff"/>
  <circle cx="110" cy="64" r="2" fill="#5ed0ff"/>
